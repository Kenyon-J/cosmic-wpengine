[advisories]
ignore = [
    # Potential use-after-free due to lack of panic safety in `LruCache::pop()`
    # Only occurs in lru 0.16.4, but this is a deeply nested dependency of iced via libcosmic.
    # The fix (0.16.5+) is not resolving due to git lock dependencies, and pop() panic safety
    # isn't an issue for cryoglyph's normal use case anyway.
    "RUSTSEC-2026-0253",

    # Nested dependencies of iced via zbus_xml
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",

    # rustls issue, update required in iced/reqwest
    "RUSTSEC-2026-0285"
]
